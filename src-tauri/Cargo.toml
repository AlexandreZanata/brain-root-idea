[package]
name = "brainroot"
version = "0.0.4"
description = "BrainRoot experimental Linux shell"
authors = ["BrainRoot contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.2", features = ["json"] }
keyring = "4.2.0"
uuid = { version = "1.26.1", features = ["v4"] }

[features]
probe = ["tauri/unstable", "dep:gtk", "dep:wry"]

[[bin]]
name = "webview_probe"
path = "src/bin/webview_probe.rs"
required-features = ["probe"]

[[bin]]
name = "preview_hosting_probe"
path = "src/bin/preview_hosting_probe.rs"
required-features = ["probe"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
wry = { version = "0.55", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
